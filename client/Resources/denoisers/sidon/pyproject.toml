[project]
name = "audio-lab-sidon"
version = "0.1.0"
description = "Audio lab helper: Sidon generative speech restoration (sarulab-speech, MIT)."
requires-python = ">=3.12,<3.13"
# Versions match the authors' Hugging Face demo (sidon_demo_beta uv.lock).
dependencies = [
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "transformers==4.53.3",
  "huggingface-hub>=0.33",
  "numpy==2.2.6",
  "soundfile>=0.13",
]

[tool.uv]
package = false
