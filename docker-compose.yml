# Local development Postgres for koom.
#
# A project-local container holding koom's own `koom` database. It
# matches the Postgres major version, database name, and user of the
# Render Postgres instance declared in render.yaml so local migrations
# behave like production. The host port (54322) and koom/koom
# credentials are what web/.env.example, web/.env.test.local, and
# `npm run db:*` expect.
#
#   npm run db:start   # start in the background and wait until healthy
#   npm run db:reset   # wipe the public schema and apply db/migrations
#   npm run db:stop    # stop the container (data volume is kept)

name: koom

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: koom
      POSTGRES_PASSWORD: koom
      POSTGRES_DB: koom
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koom -d koom"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
