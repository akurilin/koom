<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>koom — Interactive Architecture Map</title>
    <meta
      name="description"
      content="Interactive Google Maps-style system architecture explorer for koom — self-hosted macOS screen recorder with direct-to-R2 uploads, on-device AI, and zero-egress playback."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c5dada'/%3E%3Ccircle cx='32' cy='32' r='23' fill='%233b5ccc'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23253e73'/%3E%3Ccircle cx='25' cy='25' r='6' fill='%23ffffff'/%3E%3Ccircle cx='36' cy='36' r='3' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("koom-arch-theme");
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : prefersDark
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch {
          // Ignore storage errors in restricted environments.
        }
      })();
    </script>
    <style>
      :root {
        --bg: #f3f6fb;
        --card: #ffffff;
        --card-glass: rgba(255, 255, 255, 0.92);
        --fg: #0f172a;
        --muted: #475569;
        --border: #cbd5e1;
        --border-subtle: rgba(148, 163, 184, 0.32);
        --code-bg: rgba(148, 163, 184, 0.14);
        --code-fg: #1e293b;
        --primary: #2563eb;
        --primary-fg: #ffffff;
        --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.06);
        --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.12);
        --shadow-lg: 0 14px 36px rgba(15, 23, 42, 0.16);
      }

      html[data-theme="dark"] {
        --bg: #0b1120;
        --card: #111827;
        --card-glass: rgba(17, 24, 39, 0.9);
        --fg: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --border-subtle: rgba(148, 163, 184, 0.22);
        --code-bg: rgba(148, 163, 184, 0.16);
        --code-fg: #e2e8f0;
        --primary: #3b82f6;
        --primary-fg: #ffffff;
        --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.28);
        --shadow-md: 0 10px 32px rgba(0, 0, 0, 0.42);
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI",
          system-ui, sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      #viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        background-color: var(--bg);
        touch-action: none;
      }
      #viewport.dragging {
        cursor: grabbing;
      }

      #grid-canvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #world-layer {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        will-change: transform;
      }

      #edges-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 3020px;
        height: 1740px;
        overflow: visible;
        pointer-events: none;
      }

      .edge-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 22;
        pointer-events: stroke;
        cursor: pointer;
      }
      .edge-path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition:
          opacity 0.25s ease,
          stroke-width 0.25s ease;
      }
      .edge-flow {
        fill: none;
        stroke-linecap: round;
        pointer-events: none;
        stroke-dasharray: 10 14;
        animation: flowDash 1.1s linear infinite;
      }
      @keyframes flowDash {
        from {
          stroke-dashoffset: 24;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      .district {
        position: absolute;
        border-radius: 24px;
        border: 2px solid;
        transition:
          opacity 0.25s ease,
          box-shadow 0.25s ease;
        box-shadow: var(--shadow-sm);
      }
      .district-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 22px 12px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.22);
        cursor: pointer;
      }
      .district-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .district-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 17px;
        font-weight: 700;
        flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
      }
      .district-title {
        font-size: 20px;
        font-weight: 750;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .district-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .district-badge {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .district-macro {
        position: absolute;
        inset: 72px 24px 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease;
      }
      .zoom-world .district-macro {
        opacity: 1;
      }
      .zoom-world .module-card {
        opacity: 0.14;
        pointer-events: none;
      }
      .zoom-world .edge-label-pill {
        opacity: 0.92;
      }

      .module-card {
        position: absolute;
        border-radius: 16px;
        background: var(--card);
        border: 1.5px solid var(--border);
        padding: 14px 16px;
        cursor: pointer;
        transition:
          transform 0.18s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease,
          opacity 0.25s ease;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .module-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .module-card.selected {
        box-shadow:
          0 0 0 3px var(--ring-color, #2563eb),
          var(--shadow-lg);
        border-color: var(--ring-color, #2563eb);
      }
      .module-card.dimmed,
      .district.dimmed {
        opacity: 0.22;
      }
      .module-card.highlighted {
        box-shadow:
          0 0 0 2.5px var(--ring-color, #2563eb),
          var(--shadow-md);
      }

      .module-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .module-title {
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.25;
        color: var(--fg);
      }
      .module-tag {
        font-size: 10.5px;
        font-weight: 650;
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .module-summary {
        font-size: 12.2px;
        line-height: 1.42;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .street-details {
        margin-top: auto;
        padding-top: 8px;
        border-top: 1px dashed rgba(148, 163, 184, 0.35);
        display: flex;
        flex-direction: column;
        gap: 5px;
        transition: opacity 0.2s ease;
      }
      .zoom-district .street-details {
        opacity: 0.88;
      }
      .zoom-street .street-details {
        opacity: 1;
      }

      .code-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .code-chip {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.8px;
        line-height: 1.25;
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--code-bg);
        color: var(--code-fg);
        border: 1px solid var(--border-subtle);
        text-decoration: none;
      }
      a.code-chip:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .street-only {
        display: none;
        font-size: 11px;
        line-height: 1.38;
        color: var(--muted);
        margin-top: 2px;
      }
      .zoom-street .street-only {
        display: block;
      }

      .edge-label-pill {
        position: absolute;
        transform: translate(-50%, -50%);
        background: var(--card);
        border: 1.5px solid var(--border);
        color: var(--fg);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition:
          opacity 0.22s ease,
          transform 0.16s ease,
          border-color 0.2s ease;
        z-index: 6;
      }
      .edge-label-pill:hover {
        transform: translate(-50%, -50%) scale(1.06);
        z-index: 15;
      }
      .edge-label-pill.dimmed {
        opacity: 0.15;
        pointer-events: none;
      }
      .edge-step-num {
        width: 19px;
        height: 19px;
        border-radius: 50%;
        color: #ffffff;
        font-size: 11px;
        font-weight: 750;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .hud-glass {
        background: var(--card-glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-md);
      }

      #top-bar {
        position: fixed;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        pointer-events: none;
        z-index: 40;
        flex-wrap: wrap;
      }
      #top-left {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        flex-wrap: wrap;
        pointer-events: none;
      }
      #top-left > *,
      #top-right > * {
        pointer-events: auto;
      }
      #top-right {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 3px;
        pointer-events: none;
      }

      #search-wrap {
        position: relative;
        width: 310px;
        max-width: calc(100vw - 28px);
      }
      #search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 12px;
        border-radius: 999px;
      }
      .brand-lens {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 38% 35%,
          #ffffff 0 16%,
          #1e3a6e 17% 46%,
          #3b5ccc 47% 74%,
          #c5dada 75% 100%
        );
        flex-shrink: 0;
        box-shadow: 0 1px 4px rgba(30, 58, 110, 0.28);
      }
      #search-input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg);
        font-size: 13.5px;
        min-width: 0;
      }
      #search-input::placeholder {
        color: var(--muted);
      }
      #search-clear {
        display: none;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 15px;
        padding: 2px 4px;
      }
      #search-results {
        display: none;
        position: absolute;
        top: 50px;
        left: 0;
        right: 0;
        border-radius: 16px;
        max-height: 330px;
        overflow-y: auto;
        padding: 6px;
      }
      #search-results.open {
        display: block;
      }
      .search-item {
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .search-item:hover,
      .search-item.active {
        background: rgba(59, 130, 246, 0.14);
      }

      #journey-chips {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        padding-top: 3px;
      }
      .journey-chip,
      .nav-pill {
        height: 38px;
        padding: 0 14px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--fg);
        text-decoration: none;
        transition: all 0.16s ease;
      }
      .journey-chip:hover,
      .nav-pill:hover {
        transform: translateY(-1px);
      }
      .journey-chip.active {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: transparent;
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
      }
      .chip-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .journey-chip.active .chip-dot {
        background: #ffffff !important;
      }

      #journey-banner {
        display: none;
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        border-radius: 16px;
        padding: 10px 14px;
        max-width: min(760px, calc(100vw - 440px));
      }
      #journey-banner.open {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .step-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .step-pill {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: all 0.15s ease;
      }
      .step-pill:hover,
      .step-pill.active {
        border-color: var(--primary);
        background: rgba(37, 99, 235, 0.14);
      }

      #inspector {
        position: fixed;
        top: 68px;
        right: 14px;
        width: 350px;
        max-width: calc(100vw - 28px);
        max-height: calc(100vh - 154px);
        border-radius: 18px;
        z-index: 45;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: translateX(390px);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.2s ease;
      }
      #inspector.open {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
      }
      #inspector-body {
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        user-select: text;
      }

      #minimap-card {
        position: fixed;
        left: 14px;
        bottom: 14px;
        width: 212px;
        border-radius: 14px;
        padding: 8px;
        z-index: 40;
      }
      #minimap-canvas {
        width: 196px;
        height: 114px;
        display: block;
        border-radius: 8px;
        cursor: crosshair;
        background: rgba(148, 163, 184, 0.1);
      }
      .minimap-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
      }

      #map-controls {
        position: fixed;
        right: 14px;
        bottom: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        z-index: 40;
      }
      .ctrl-stack {
        display: flex;
        flex-direction: column;
        border-radius: 14px;
        overflow: hidden;
      }
      .ctrl-btn {
        width: 38px;
        height: 36px;
        border: none;
        background: transparent;
        color: var(--fg);
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.14s ease;
      }
      .ctrl-btn:hover {
        background: rgba(148, 163, 184, 0.18);
      }
      .ctrl-btn + .ctrl-btn {
        border-top: 1px solid var(--border-subtle);
      }

      #lod-pill {
        padding: 5px 11px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--fg);
      }

      #legend-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 11px;
        color: var(--muted);
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .legend-line {
        width: 16px;
        height: 3px;
        border-radius: 2px;
        display: inline-block;
      }

      @media (max-width: 820px) {
        #minimap-card,
        #legend-bar {
          display: none;
        }
        #journey-banner {
          max-width: calc(100vw - 80px);
          left: 14px;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="viewport" class="zoom-district">
      <canvas id="grid-canvas"></canvas>
      <div id="world-layer">
        <svg id="edges-svg" viewBox="0 0 3020 1740"></svg>
        <div id="districts-layer"></div>
        <div id="modules-layer"></div>
        <div id="edge-labels-layer"></div>
      </div>
    </div>

    <div id="top-bar">
      <div id="top-left">
        <div id="search-wrap">
          <div id="search-box" class="hud-glass">
            <div class="brand-lens" title="koom"></div>
            <input
              id="search-input"
              type="text"
              placeholder="Search koom modules, routes, files, tables…"
              autocomplete="off"
            />
            <button id="search-clear" title="Clear">✕</button>
          </div>
          <div id="search-results" class="hud-glass"></div>
        </div>

        <div id="journey-chips">
          <button class="journey-chip hud-glass active" data-journey="all">
            <span class="chip-dot" style="background: #3b82f6"></span>
            All Flows
          </button>
          <button class="journey-chip hud-glass" data-journey="upload">
            <span class="chip-dot" style="background: #ea580c"></span>
            Record &amp; Upload
          </button>
          <button class="journey-chip hud-glass" data-journey="watch">
            <span class="chip-dot" style="background: #7c3aed"></span>
            Watch &amp; Comment
          </button>
          <button class="journey-chip hud-glass" data-journey="auth">
            <span class="chip-dot" style="background: #db2777"></span>
            Auth &amp; Pairing
          </button>
          <button class="journey-chip hud-glass" data-journey="ops">
            <span class="chip-dot" style="background: #475569"></span>
            Deploy &amp; Ops
          </button>
        </div>
      </div>

      <div id="top-right">
        <button
          id="theme-toggle"
          class="nav-pill hud-glass"
          title="Toggle light/dark theme"
          aria-label="Toggle light/dark theme"
        >
          <span id="theme-icon">☾</span>
        </button>
        <a
          class="nav-pill hud-glass"
          href="https://github.com/akurilin/koom"
          target="_blank"
          rel="noopener noreferrer"
          title="View koom repository on GitHub"
        >
          GitHub ↗
        </a>
      </div>
    </div>

    <aside id="inspector" class="hud-glass">
      <div
        id="inspector-header"
        style="
          padding: 14px 16px;
          border-bottom: 1px solid var(--border-subtle);
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 10px;
        "
      >
        <div>
          <div
            id="insp-kicker"
            style="
              font-size: 11px;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 0.05em;
            "
          ></div>
          <h2
            id="insp-title"
            style="
              margin: 2px 0 0;
              font-size: 16.5px;
              font-weight: 750;
              line-height: 1.25;
            "
          ></h2>
        </div>
        <button
          id="insp-close"
          style="
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 8px;
          "
          title="Close (Esc)"
        >
          ✕
        </button>
      </div>
      <div id="inspector-body"></div>
    </aside>

    <div id="journey-banner" class="hud-glass">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
        "
      >
        <div
          id="journey-title"
          style="font-size: 12.5px; font-weight: 700"
        ></div>
        <button
          id="journey-reset"
          style="
            border: none;
            background: transparent;
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
          "
        >
          Show All
        </button>
      </div>
      <div id="journey-steps" class="step-pills"></div>
    </div>

    <div id="minimap-card" class="hud-glass">
      <canvas id="minimap-canvas" width="392" height="228"></canvas>
      <div class="minimap-footer">

            pulse.setAttribute("stroke-opacity", "0.8");
            pulse.setAttribute(
              "stroke-width",
              e.kind === "media" ? "2.5" : "1.6",
            );
            pulse.style.display = "none";
            g.appendChild(pulse);

            const hit = document.createElementNS(ns, "path");
            hit.setAttribute("d", e.path);
            hit.setAttribute("class", "edge-hit");
            hit.addEventListener("click", (ev) => {
              if (state.dragDist > 6) return;
              ev.stopPropagation();
              selectEdge(e.id);
            });
            g.appendChild(hit);
            edgesSvg.appendChild(g);

            if (e.labelPos) {
              const pill = document.createElement("div");
              pill.className = "edge-label-pill";
              pill.dataset.edgeLabelId = e.id;
              pill.style.left = e.labelPos[0] + "px";
              pill.style.top = e.labelPos[1] + "px";
              pill.style.borderColor = e.color + "66";
              pill.innerHTML = `
                ${e.step ? `<span class="edge-step-num" style="background:${e.color}">${e.step}</span>` : ""}
                <span>${e.label}</span>
              `;
              pill.addEventListener("click", (ev) => {
                if (state.dragDist > 6) return;
                ev.stopPropagation();
                selectEdge(e.id);
              });
              edgeLabelsLayer.appendChild(pill);
            }
          }
        }

        function updateDistrictThemeColors() {
          const dark = isDarkTheme();
          document.querySelectorAll(".district").forEach((el) => {
            const d = districtMap[el.dataset.districtId];
            if (d) el.style.background = dark ? d.darkBg : d.lightBg;
          });
        }

        function applyTransform() {
          worldLayer.style.transform = `translate3d(${state.x}px, ${state.y}px, 0) scale(${state.scale})`;

          viewport.classList.remove(
            "zoom-world",
            "zoom-district",
            "zoom-street",
          );
          if (state.scale < 0.34) {
            viewport.classList.add("zoom-world");
            lodLabel.textContent = "World View";
          } else if (state.scale < 0.88) {
            viewport.classList.add("zoom-district");
            lodLabel.textContent = "District View";
          } else {
            viewport.classList.add("zoom-street");
            lodLabel.textContent = "Street / Code View";
          }
          zoomPct.textContent = Math.round(state.scale * 100) + "%";

          drawGrid();
          drawMinimap();
        }

        function drawGrid() {
          const dpr = window.devicePixelRatio || 1;
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          if (
            gridCanvas.width !== Math.round(vw * dpr) ||
            gridCanvas.height !== Math.round(vh * dpr)
          ) {
            gridCanvas.width = Math.round(vw * dpr);
            gridCanvas.height = Math.round(vh * dpr);
            gridCanvas.style.width = vw + "px";
            gridCanvas.style.height = vh + "px";
          }
          gridCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          gridCtx.clearRect(0, 0, vw, vh);

          const dark = isDarkTheme();
          const step = 80 * state.scale;
          if (step < 14) return;

          const offsetX = ((state.x % step) + step) % step;
          const offsetY = ((state.y % step) + step) % step;

          gridCtx.fillStyle = dark
            ? "rgba(148, 163, 184, 0.2)"
            : "rgba(100, 116, 139, 0.22)";
          for (let x = offsetX; x < vw; x += step) {
            for (let y = offsetY; y < vh; y += step) {
              gridCtx.beginPath();
              gridCtx.arc(x, y, 1.15, 0, Math.PI * 2);
              gridCtx.fill();
            }
          }

          const major = 320 * state.scale;
          const mx0 = ((state.x % major) + major) % major;
          const my0 = ((state.y % major) + major) % major;
          gridCtx.strokeStyle = dark
            ? "rgba(148, 163, 184, 0.07)"
            : "rgba(100, 116, 139, 0.07)";
          gridCtx.lineWidth = 1;
          gridCtx.beginPath();
          for (let x = mx0; x < vw; x += major) {
            gridCtx.moveTo(x, 0);
            gridCtx.lineTo(x, vh);
          }
          for (let y = my0; y < vh; y += major) {
            gridCtx.moveTo(0, y);
            gridCtx.lineTo(vw, y);
          }
          gridCtx.stroke();
        }

        function drawMinimap() {
          const w = minimapCanvas.width;
          const h = minimapCanvas.height;
          const sx = w / WORLD_W;
          const sy = h / WORLD_H;
          const dark = isDarkTheme();

          minimapCtx.clearRect(0, 0, w, h);
          minimapCtx.fillStyle = dark
            ? "rgba(15, 23, 42, 0.65)"
            : "rgba(241, 245, 249, 0.9)";
          minimapCtx.fillRect(0, 0, w, h);

          for (const d of DISTRICTS) {
            minimapCtx.fillStyle = d.accent + "44";
            minimapCtx.strokeStyle = d.accent;
            minimapCtx.lineWidth = 1.6;
            const rx = d.x * sx;
            const ry = d.y * sy;
            const rw = d.w * sx;
            const rh = d.h * sy;
            minimapCtx.beginPath();
            minimapCtx.roundRect(rx, ry, rw, rh, 5);
            minimapCtx.fill();
            minimapCtx.stroke();
          }

          const vx = (-state.x / state.scale) * sx;
          const vy = (-state.y / state.scale) * sy;
          const vw = (window.innerWidth / state.scale) * sx;
          const vh = (window.innerHeight / state.scale) * sy;

          minimapCtx.fillStyle = "rgba(37, 99, 235, 0.16)";
          minimapCtx.strokeStyle = "#3b82f6";
          minimapCtx.lineWidth = 2.4;
          minimapCtx.fillRect(vx, vy, vw, vh);
          minimapCtx.strokeRect(vx, vy, vw, vh);
        }

        function stopAnim() {
          if (state.animId) {
            cancelAnimationFrame(state.animId);
            state.animId = null;
          }
        }

        function animateTo(tx, ty, ts, duration = 420) {
          stopAnim();
          const sx = state.x;
          const sy = state.y;
          const ss = state.scale;
          const start = performance.now();
          const ease = (t) => 1 - Math.pow(1 - t, 3);
          function tick(now) {
            const p = Math.min(1, (now - start) / duration);
            const e = ease(p);
            state.x = sx + (tx - sx) * e;
            state.y = sy + (ty - sy) * e;
            state.scale = ss + (ts - ss) * e;
            applyTransform();
            if (p < 1) {
              state.animId = requestAnimationFrame(tick);
            } else {
              state.animId = null;
            }
          }
          state.animId = requestAnimationFrame(tick);
        }

        function flyToRect(rx, ry, rw, rh, maxZoom = 1.45) {
          const padTop = 74;
          const padRight = inspector.classList.contains("open") ? 380 : 36;
          const padBottom = 64;
          const padLeft = 36;
          const availW = Math.max(240, window.innerWidth - padLeft - padRight);
          const availH = Math.max(200, window.innerHeight - padTop - padBottom);
          const targetScale = Math.max(
            state.minScale,
            Math.min(maxZoom, availW / rw, availH / rh),
          );
          const cx = rx + rw / 2;
          const cy = ry + rh / 2;
          const targetX = padLeft + availW / 2 - cx * targetScale;
          const targetY = padTop + availH / 2 - cy * targetScale;
          animateTo(targetX, targetY, targetScale);
        }

        function fitAll(instant = false) {
          const padTop = 68;
          const padBottom = 40;
          const padX = 28;
          const availW = Math.max(300, window.innerWidth - padX * 2);
          const availH = Math.max(220, window.innerHeight - padTop - padBottom);
          const s = Math.max(
            state.minScale,
            Math.min(1.0, availW / WORLD_W, availH / WORLD_H),
          );
          const x = padX + (availW - WORLD_W * s) / 2;
          const y = padTop + (availH - WORLD_H * s) / 2;
          if (instant) {
            state.x = x;
            state.y = y;
            state.scale = s;
            applyTransform();
          } else {
            animateTo(x, y, s, 400);
          }
        }

        function zoomAt(clientX, clientY, factor) {
          stopAnim();
          const nextScale = Math.max(
            state.minScale,
            Math.min(state.maxScale, state.scale * factor),
          );
          const ratio = nextScale / state.scale;
          state.x = clientX - (clientX - state.x) * ratio;
          state.y = clientY - (clientY - state.y) * ratio;
          state.scale = nextScale;
          applyTransform();
        }

        viewport.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          stopAnim();
          state.dragging = true;
          state.lastX = e.clientX;
          state.lastY = e.clientY;
          state.vx = 0;
          state.vy = 0;
          state.dragDist = 0;
          viewport.classList.add("dragging");
        });

        window.addEventListener("pointermove", (e) => {
          if (!state.dragging) return;
          const dx = e.clientX - state.lastX;
          const dy = e.clientY - state.lastY;
          state.lastX = e.clientX;
          state.lastY = e.clientY;
          state.dragDist += Math.hypot(dx, dy);
          state.x += dx;
          state.y += dy;
          state.vx = dx;
          state.vy = dy;
          applyTransform();
        });

        window.addEventListener("pointerup", () => {
          if (!state.dragging) return;
          state.dragging = false;
          viewport.classList.remove("dragging");
          if (Math.hypot(state.vx, state.vy) > 2.2) {
            function glide() {
              state.vx *= 0.91;
              state.vy *= 0.91;
              state.x += state.vx;
              state.y += state.vy;
              applyTransform();
              if (Math.hypot(state.vx, state.vy) > 0.35) {
                state.animId = requestAnimationFrame(glide);
              } else {
                state.animId = null;
              }
            }
            state.animId = requestAnimationFrame(glide);
          }
        });

        viewport.addEventListener("click", () => {
          if (state.dragDist > 6) return;
          clearSelection();
        });

        viewport.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const isPinch = e.ctrlKey;
            const intensity = isPinch ? 0.012 : 0.0018;
            const factor = Math.exp(-e.deltaY * intensity);
            zoomAt(e.clientX, e.clientY, factor);
          },
          { passive: false },
        );

        let mmDragging = false;
        function panFromMinimap(e) {
          const rect = minimapCanvas.getBoundingClientRect();
          const wx = ((e.clientX - rect.left) / rect.width) * WORLD_W;
          const wy = ((e.clientY - rect.top) / rect.height) * WORLD_H;
          stopAnim();
          state.x = window.innerWidth / 2 - wx * state.scale;
          state.y = window.innerHeight / 2 - wy * state.scale;
          applyTransform();
        }
        minimapCanvas.addEventListener("pointerdown", (e) => {
          mmDragging = true;
          minimapCanvas.setPointerCapture(e.pointerId);
          panFromMinimap(e);
        });
        minimapCanvas.addEventListener("pointermove", (e) => {
          if (mmDragging) panFromMinimap(e);
        });
        minimapCanvas.addEventListener("pointerup", () => {
          mmDragging = false;
        });

        function applyVisualFilters() {
          const j = state.activeJourney;
          const selMod =
            state.selectedType === "module" ? state.selectedId : null;
          const selEdge =
            state.selectedType === "edge" ? state.selectedId : null;

          const neighborMods = new Set();
          const neighborEdges = new Set();
          if (selMod) {
            neighborMods.add(selMod);
            for (const e of EDGES) {
              if (e.from === selMod || e.to === selMod) {
                neighborEdges.add(e.id);
                neighborMods.add(e.from);
                neighborMods.add(e.to);
              }
            }
          } else if (selEdge) {
            const e = edgeMap[selEdge];
            if (e) {
              neighborEdges.add(e.id);
              neighborMods.add(e.from);
              neighborMods.add(e.to);
            }
          }

          document.querySelectorAll(".module-card").forEach((el) => {
            const m = moduleMap[el.dataset.moduleId];
            const inJourney = j === "all" || m.journeys.includes(j);
            const isSelected = selMod === m.id;
            const isNeighbor = neighborMods.has(m.id);

            el.classList.toggle("selected", isSelected);
            el.classList.toggle(
              "highlighted",
              !isSelected &&
                ((j !== "all" && inJourney) ||
                  (selMod && isNeighbor) ||
                  (selEdge && isNeighbor)),
            );
            const shouldDim =
              (j !== "all" && !inJourney) ||
              ((selMod || selEdge) && !isNeighbor);
            el.classList.toggle("dimmed", !!shouldDim);
          });

          document.querySelectorAll(".district").forEach((el) => {
            const did = el.dataset.districtId;
            const hasActiveMod = MODULES.some((m) => {
              if (m.district !== did) return false;
              const inJourney = j === "all" || m.journeys.includes(j);
              const inSel = !(selMod || selEdge) || neighborMods.has(m.id);
              return inJourney && inSel;
            });
            el.classList.toggle("dimmed", !hasActiveMod);
          });

          edgesSvg.querySelectorAll("g[data-edge-id]").forEach((g) => {
            const e = edgeMap[g.dataset.edgeId];
            const inJourney = j === "all" || e.journeys.includes(j);
            const isFocus =
              selEdge === e.id || (selMod && neighborEdges.has(e.id));
            const active = inJourney && (!(selMod || selEdge) || isFocus);
            const base = g.querySelector(".edge-path");
            const pulse = g.querySelector(".edge-flow");

            base.style.opacity = active ? "1" : "0.12";
            base.setAttribute(
              "stroke-width",
              isFocus
                ? e.kind === "media"
                  ? "7"
                  : "4.5"
                : e.kind === "media"
                  ? "5.5"
                  : e.kind === "local"
                    ? "2.4"
                    : "3",
            );
            pulse.style.display =
              active && (j !== "all" || isFocus) ? "block" : "none";

            const pill = edgeLabelsLayer.querySelector(
              `[data-edge-label-id="${e.id}"]`,
            );
            if (pill) {
              pill.classList.toggle("dimmed", !active);
            }
          });
        }

        function setJourney(journeyId) {
          state.activeJourney = journeyId;
          document.querySelectorAll(".journey-chip").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.journey === journeyId);
          });

          const banner = document.getElementById("journey-banner");
          if (journeyId === "all") {
            banner.classList.remove("open");
            applyVisualFilters();
            return;
          }

          const j = JOURNEYS[journeyId];
          document.getElementById("journey-title").textContent = j.title;
          const stepsEl = document.getElementById("journey-steps");
          stepsEl.innerHTML = j.steps
            .map(
              (s, idx) => `
            <button class="step-pill" data-target-mod="${s.target}" data-step-idx="${idx}">${s.label}</button>
          `,
            )
            .join("");
          stepsEl.querySelectorAll(".step-pill").forEach((btn) => {
            btn.addEventListener("click", () => {
              stepsEl
                .querySelectorAll(".step-pill")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              const m = moduleMap[btn.dataset.targetMod];
              if (m) {
                selectModule(m.id, false);
                flyToRect(m.x - 100, m.y - 100, m.w + 200, m.h + 200, 1.32);
              }
            });
          });
          banner.classList.add("open");
          applyVisualFilters();
        }

        function openInspector(kicker, color, title, html) {
          inspKicker.textContent = kicker;
          inspKicker.style.color = color;
          inspTitle.textContent = title;
          inspBody.innerHTML = html;
          inspector.classList.add("open");

          inspBody.querySelectorAll("[data-jump-mod]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const m = moduleMap[btn.dataset.jumpMod];
              if (m) {
                selectModule(m.id);
                flyToRect(m.x - 90, m.y - 90, m.w + 180, m.h + 180, 1.32);
              }
            });
          });
        }

        function clearSelection() {
          state.selectedType = null;
          state.selectedId = null;
          inspector.classList.remove("open");
          applyVisualFilters();
        }

        function selectModule(id, autoUpdate = true) {
          const m = moduleMap[id];
          if (!m) return;
          const d = districtMap[m.district];
          state.selectedType = "module";
          state.selectedId = id;

          const inbound = EDGES.filter((e) => e.to === id);
          const outbound = EDGES.filter((e) => e.from === id);

          const connList = (edges, dir) =>
            edges.length === 0
              ? `<div style="font-size:12px; color:var(--muted);">None</div>`
              : edges
                  .map((e) => {
                    const other = moduleMap[dir === "in" ? e.from : e.to];
                    const arrow = dir === "in" ? "←" : "→";
                    return `
                      <button data-jump-mod="${other.id}" style="width:100%; text-align:left; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--bg); cursor:pointer; display:flex; flex-direction:column; gap:2px;">
                        <div style="font-size:12px; font-weight:700; color:var(--fg);">${arrow} ${other.title}</div>
                        <div style="font-size:11.5px; color:${e.color}; font-family:monospace;">${e.label}</div>
                      </button>
                    `;
                  })
                  .join("");

          openInspector(
            `${d.name} · ${m.tag}`,
            d.accent,
            m.title,
            `
              <p style="margin:0; font-size:13px; line-height:1.5; color:var(--fg);">${m.summary}</p>
              <p style="margin:0; font-size:12.2px; line-height:1.48; color:var(--muted);">${m.streetNote}</p>

              ${
                m.invariants?.length
                  ? `
                <div>
                  <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:6px;">Key Invariants</div>
                  <ul style="margin:0; padding-left:16px; font-size:12.2px; line-height:1.48; display:flex; flex-direction:column; gap:4px;">
                    ${m.invariants.map((i) => `<li>${i}</li>`).join("")}
                  </ul>
                </div>
              `
                  : ""
              }

              <div>
                <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:6px;">Outbound Interfaces (${outbound.length})</div>
                <div style="display:flex; flex-direction:column; gap:6px;">${connList(outbound, "out")}</div>
              </div>

              <div>
                <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:6px;">Inbound Interfaces (${inbound.length})</div>
                <div style="display:flex; flex-direction:column; gap:6px;">${connList(inbound, "in")}</div>
              </div>

              <div>
                <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:6px;">Source Files (GitHub ↗)</div>
                <div class="code-chips">
                  ${m.files
                    .map(
                      (f) =>
                        `<a class="code-chip" href="${REPO_BLOB}${f}" target="_blank" rel="noopener noreferrer">${f} ↗</a>`,
                    )
                    .join("")}
                </div>
              </div>

              <button id="btn-zoom-street" style="padding:9px 12px; border-radius:10px; border:none; background:${d.accent}; color:#fff; font-size:12.5px; font-weight:650; cursor:pointer;">
                Zoom to Street Level
              </button>
            `,
          );

          const zbtn = document.getElementById("btn-zoom-street");
          if (zbtn)
            zbtn.addEventListener("click", () =>
              flyToRect(m.x - 60, m.y - 60, m.w + 120, m.h + 120, 1.45),
            );
          if (autoUpdate) applyVisualFilters();
        }

        function selectEdge(id) {
          const e = edgeMap[id];
          if (!e) return;
          const fromM = moduleMap[e.from];
          const toM = moduleMap[e.to];
          state.selectedType = "edge";
          state.selectedId = id;

          const kindLabel =
            {
              media: "Direct Media Highway",
              api: "HTTPS / S3 / SQL Interface",
              auth: "Auth / Control Flow",
              local: "Local In-Process Pipeline",
              ops: "Deployment / Ops",
            }[e.kind] || "Interface";

          openInspector(
            kindLabel,
            e.color,
            e.label,
            `
              <p style="margin:0; font-size:13px; line-height:1.52;">${e.detail}</p>
              <div>
                <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:6px;">Connected Modules</div>
                <div style="display:flex; flex-direction:column; gap:6px;">
                  <button data-jump-mod="${fromM.id}" style="text-align:left; padding:9px 11px; border-radius:10px; border:1px solid var(--border); background:var(--bg); cursor:pointer;">
                    <div style="font-size:10.5px; color:var(--muted);">FROM</div>
                    <div style="font-size:13px; font-weight:700; color:var(--fg);">${fromM.title}</div>
                  </button>
                  <button data-jump-mod="${toM.id}" style="text-align:left; padding:9px 11px; border-radius:10px; border:1px solid var(--border); background:var(--bg); cursor:pointer;">
                    <div style="font-size:10.5px; color:var(--muted);">TO</div>
                    <div style="font-size:13px; font-weight:700; color:var(--fg);">${toM.title}</div>
                  </button>
                </div>
              </div>
            `,
          );
          applyVisualFilters();
        }

        function selectDistrict(id) {
          const d = districtMap[id];
          if (!d) return;
          state.selectedType = "district";
          state.selectedId = id;
          const mods = MODULES.filter((m) => m.district === id);

          openInspector(
            d.badge,
            d.accent,
            d.name,
            `
              <p style="margin:0; font-size:13px; line-height:1.5;">${d.subtitle}</p>
              <ul style="margin:0; padding-left:16px; font-size:12.2px; line-height:1.5; display:flex; flex-direction:column; gap:4px;">
                ${d.macroPoints.map((p) => `<li>${p}</li>`).join("")}
              </ul>
              <div>
                <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:6px;">Modules Inside (${mods.length})</div>
                <div style="display:flex; flex-direction:column; gap:6px;">
                  ${mods
                    .map(
                      (m) => `
                    <button data-jump-mod="${m.id}" style="text-align:left; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--bg); cursor:pointer;">
                      <div style="font-size:12.5px; font-weight:700; color:var(--fg);">${m.title}</div>
                      <div style="font-size:11.2px; color:var(--muted);">${m.tag}</div>
                    </button>
                  `,
                    )
                    .join("")}
                </div>
              </div>
            `,
          );
        }

        const searchInput = document.getElementById("search-input");
        const searchClear = document.getElementById("search-clear");
        const searchResults = document.getElementById("search-results");

        const searchIndex = [
          ...DISTRICTS.map((d) => ({
            kind: "District",
            id: d.id,
            title: d.name,
            sub: d.badge,
            color: d.accent,
            haystack:
              `${d.name} ${d.subtitle} ${d.badge} ${d.macroPoints.join(" ")}`.toLowerCase(),
          })),
          ...MODULES.map((m) => ({
            kind: "Module",
            id: m.id,
            title: m.title,
            sub: `${districtMap[m.district].name} · ${m.tag}`,
            color: districtMap[m.district].accent,
            haystack:
              `${m.title} ${m.tag} ${m.summary} ${m.streetNote} ${m.chips.join(" ")} ${m.files.join(" ")}`.toLowerCase(),
          })),
          ...EDGES.filter((e) => e.labelPos).map((e) => ({
            kind: "Interface",
            id: e.id,
            title: e.label,
            sub: `${moduleMap[e.from].title} → ${moduleMap[e.to].title}`,
            color: e.color,
            haystack:
              `${e.label} ${e.detail} ${moduleMap[e.from].title} ${moduleMap[e.to].title}`.toLowerCase(),
          })),
        ];

        function renderSearch(q) {
          const query = q.trim().toLowerCase();
          searchClear.style.display = query ? "block" : "none";
          if (!query) {
            searchResults.classList.remove("open");
            return;
          }
          const hits = searchIndex
            .filter((item) => item.haystack.includes(query))
            .slice(0, 10);
          if (!hits.length) {
            searchResults.innerHTML = `<div style="padding:10px 12px; font-size:12.5px; color:var(--muted);">No matching modules, routes, or files.</div>`;
          } else {
            searchResults.innerHTML = hits
              .map(
                (h) => `
              <div class="search-item" data-skind="${h.kind}" data-sid="${h.id}">
                <div style="min-width:0;">
                  <div style="font-size:13px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${h.title}</div>
                  <div style="font-size:11.2px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${h.sub}</div>
                </div>
                <span style="font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; background:${h.color}1c; color:${h.color}; flex-shrink:0;">${h.kind}</span>
              </div>
            `,
              )
              .join("");
            searchResults.querySelectorAll(".search-item").forEach((row) => {
              row.addEventListener("click", () => {
                const kind = row.dataset.skind;
                const id = row.dataset.sid;
                searchResults.classList.remove("open");
                if (kind === "District") {
                  const d = districtMap[id];
                  flyToRect(d.x - 40, d.y - 40, d.w + 80, d.h + 80);
                  selectDistrict(id);
                } else if (kind === "Module") {
                  const m = moduleMap[id];
                  selectModule(id);
                  flyToRect(m.x - 80, m.y - 80, m.w + 160, m.h + 160, 1.38);
                } else {
                  const e = edgeMap[id];
                  selectEdge(id);
                  if (e.labelPos) {
                    flyToRect(
                      e.labelPos[0] - 260,
                      e.labelPos[1] - 180,
                      520,
                      360,
                      1.15,
                    );
                  }
                }
              });
            });
          }
          searchResults.classList.add("open");
        }

        searchInput.addEventListener("input", () =>
          renderSearch(searchInput.value),
        );
        searchInput.addEventListener("focus", () => {
          if (searchInput.value.trim()) searchResults.classList.add("open");
        });
        searchClear.addEventListener("click", () => {
          searchInput.value = "";
          renderSearch("");
          searchInput.focus();
        });
        document.addEventListener("click", (e) => {
          if (!document.getElementById("search-wrap").contains(e.target)) {
            searchResults.classList.remove("open");
          }
        });

        document
          .getElementById("btn-zoom-in")
          .addEventListener("click", () =>
            zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.28),
          );
        document
          .getElementById("btn-zoom-out")
          .addEventListener("click", () =>
            zoomAt(window.innerWidth / 2, window.innerHeight / 2, 0.78),
          );
        document
          .getElementById("btn-fit")
          .addEventListener("click", () => fitAll(false));
        document
          .getElementById("insp-close")
          .addEventListener("click", clearSelection);
        document
          .getElementById("journey-reset")
          .addEventListener("click", () => setJourney("all"));
        document
          .getElementById("theme-toggle")
          .addEventListener("click", () =>
            setTheme(isDarkTheme() ? "light" : "dark"),
          );

        document.querySelectorAll(".journey-chip").forEach((btn) => {
          btn.addEventListener("click", () => setJourney(btn.dataset.journey));
        });

        window.addEventListener("keydown", (e) => {
          if (document.activeElement === searchInput) {
            if (e.key === "Escape") {
              searchInput.blur();
              searchResults.classList.remove("open");
            }
            return;
          }
          if (e.key === "/") {
            e.preventDefault();
            searchInput.focus();
            return;
          }
          if (e.key === "+" || e.key === "=")
            zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.25);
          else if (e.key === "-" || e.key === "_")
            zoomAt(window.innerWidth / 2, window.innerHeight / 2, 0.8);
          else if (e.key === "0" || e.key === "f" || e.key === "F")
            fitAll(false);
          else if (e.key === "Escape") {
            clearSelection();
            setJourney("all");
          } else if (e.key >= "1" && e.key <= "7") {
            const d = DISTRICTS.find((x) => x.key === e.key);
            if (d) {
              flyToRect(d.x - 40, d.y - 40, d.w + 80, d.h + 80);
              selectDistrict(d.id);
            }
          }
        });

        window.addEventListener("resize", () => {
          drawGrid();
          drawMinimap();
        });

        syncThemeButton();
        buildWorld();
        fitAll(true);
        applyVisualFilters();
      })();
    </script>
  </body>
</html>
